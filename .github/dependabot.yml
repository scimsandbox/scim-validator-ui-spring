version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 3
    # Keep embedded Tomcat on 10.1.x while on Spring Boot 3.5.x (Tomcat 11.x targets Spring Boot 4.x).
    ignore:
      - dependency-name: "org.apache.tomcat.embed:*"
        update-types:
          - "version-update:semver-major"
    groups:
      maven-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    # Keep runtime JRE major version aligned with <java.version>25</java.version> in pom.xml.
    ignore:
      - dependency-name: "dhi.io/eclipse-temurin"
        update-types:
          - "version-update:semver-major"
    groups:
      docker-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
