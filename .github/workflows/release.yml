name: Release

on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Validate, tag, and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    outputs:
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Verify main branch
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "main" ]]; then
            echo "This release workflow can only be run manually from main."
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up JDK 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "scimsandbox-release-bot[bot]"
          git config user.email "5655615+scimsandbox-release-bot[bot]@users.noreply.github.com"

      - name: Resolve release version
        id: version
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          project_version="$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)"

          if [[ ! "$project_version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-SNAPSHOT$ ]]; then
            echo "Project version must end with -SNAPSHOT and use semantic versioning: ${project_version}" >&2
            exit 1
          fi

          release_version="${project_version%-SNAPSHOT}"
          tag_name="v${release_version}"

          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${tag_name}" >> "$GITHUB_OUTPUT"

      - name: Ensure release tag does not exist
        shell: bash
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag_name }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag_name }} already exists"
            exit 1
          fi

      - name: Validate build and tests
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mvn -B -ntp clean verify

      - name: Prepare Maven auth files
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/maven-settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          printf '<settingsSecurity/>\n' > "${RUNNER_TEMP}/maven-settings-security.xml"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build image for pre-release scan
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          secret-files: |
            maven_settings=${{ runner.temp }}/maven-settings.xml
            maven_security=${{ runner.temp }}/maven-settings-security.xml
          tags: scim-validator-ui-spring:pre-release-scan

      - name: Enforce pre-release Trivy vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scim-validator-ui-spring:pre-release-scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          trivyignores: ".trivyignore"
          ignore-unfixed: true
          vuln-type: os,library

      - name: Release with Maven Release Plugin
        shell: bash
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mvn -B -ntp release:clean release:prepare release:perform \
            -Darguments="-DskipTests"

      - name: Package release bundle
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          git archive --format=tar.gz --output "dist/scim-validator-ui-spring-${{ steps.version.outputs.release_version }}.tar.gz" "${{ steps.version.outputs.tag_name }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${{ steps.version.outputs.tag_name }}" \
            --verify-tag \
            --generate-notes \
            --title "${{ steps.version.outputs.tag_name }}" \
            "dist/scim-validator-ui-spring-${{ steps.version.outputs.release_version }}.tar.gz#scim-validator-ui-spring-${{ steps.version.outputs.release_version }}.tar.gz" \
            "target/checkout/target/scim-validator-ui-spring-${{ steps.version.outputs.release_version }}.jar#scim-validator-ui-spring-${{ steps.version.outputs.release_version }}.jar"

  attest:
    name: Attest release artifacts
    needs:
      - release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          gh release download "${TAG_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "*.tar.gz" \
            --pattern "*.jar" \
            --dir dist

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
