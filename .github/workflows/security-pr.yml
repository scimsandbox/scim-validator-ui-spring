name: Security PR Gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  security-pr:
    uses: scimsandbox/.github/.github/workflows/reusable-security-pr.yml@645f5fafbdfccdaf904de1b5f3dc832b2c12cfd9 # v1.1.0
    with:
      dependency-review: true
      # Spring Boot 3.5.x reached OSS EOL at 3.5.16 (Spring Framework 6.2.19); matches .trivyignore until Spring Boot 4.1 migration.
      allow-ghsas: "GHSA-pc63-qcmh-9cmg, GHSA-j9f9-w8pj-32f8"
