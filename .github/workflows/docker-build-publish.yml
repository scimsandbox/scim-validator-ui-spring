name: Docker Build and Publish

on:
  release:
    types:
      - published

permissions: {}

jobs:
  # Multi-arch Buildx builds (linux/amd64,linux/arm64) cannot --load into the local
  # Docker daemon simultaneously, and Trivy --input does not unpack multi-platform OCI
  # index archives. Run a least-privilege daemon-loaded scan against the release commit
  # before publishing (inline rather than reusable-trivy-image.yml, which statically
  # requests security-events: write), complementing the pre-tag Trivy gate in release.yml.
  trivy:
    name: Pre-publish Trivy scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare Maven auth files
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          cat > "${RUNNER_TEMP}/maven-settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          printf '<settingsSecurity/>\n' > "${RUNNER_TEMP}/maven-settings-security.xml"

      - name: Build image for release scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          secret-files: |
            maven_settings=${{ runner.temp }}/maven-settings.xml
            maven_security=${{ runner.temp }}/maven-settings-security.xml
          tags: scim-validator-ui-spring:release-scan

      - name: Enforce pre-publish Trivy vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scim-validator-ui-spring:release-scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          trivyignores: ".trivyignore"
          ignore-unfixed: true
          vuln-type: os,library

  docker-build-publish:
    name: Build and push scim-validator-ui-spring
    needs:
      - trivy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Prepare Maven auth files
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/maven-settings.xml" <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
          printf '<settingsSecurity/>\n' > "$RUNNER_TEMP/maven-settings-security.xml"

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: edipal
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: edipal/scim-validator-ui-spring
          tags: |
            type=raw,value=latest,enable=true
            type=raw,value=${{ github.event.release.tag_name }}
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          secret-files: |
            maven_settings=${{ runner.temp }}/maven-settings.xml
            maven_security=${{ runner.temp }}/maven-settings-security.xml
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
