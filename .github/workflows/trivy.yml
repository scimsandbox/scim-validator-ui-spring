name: Trivy Container Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  trivy:
    uses: scimsandbox/.github/.github/workflows/reusable-trivy-image.yml@c675580705cc902e5762261850f8e1b27ef641a8 # v1.0.0
    with:
      image-name: scim-validator-ui-spring:scan
      maven-github-packages: true
      trivyignores: ".trivyignore"
