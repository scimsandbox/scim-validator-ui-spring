name: Trivy Container Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read
  packages: read
  security-events: write

jobs:
  trivy:
    uses: scimsandbox/.github/.github/workflows/reusable-trivy-image.yml@645f5fafbdfccdaf904de1b5f3dc832b2c12cfd9 # v1.1.0
    with:
      image-name: scim-validator-ui-spring:scan
      maven-github-packages: true
      trivyignores: ".trivyignore"
