spring:
  threads:
    virtual:
      enabled: true
  application:
    name: scim-validator-ui

  datasource:
    hikari:
      pool-name: ScimValidatorUiHikariPool
      maximum-pool-size: 15
      minimum-idle: 15
      connection-timeout: 5000
      max-lifetime: 1800000
      keepalive-time: 30000
      data-source-properties:
        reWriteBatchedInserts: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        "[default_batch_fetch_size]": 100
        "[jdbc.batch_size]": 100
        "[order_inserts]": true
        "[order_updates]": true
  security:
    oauth2:
      client:
        registration:
          auth0:
            client-id: ${AUTH0_CLIENT_ID}
            client-secret: ${AUTH0_CLIENT_SECRET}
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: ${AUTH0_REDIRECT_URI}
        provider:
          auth0:
            issuer-uri: ${AUTH0_ISSUER_URI}

server:
  # cloudflared reaches this container over plain http, so without this the servlet layer sees an
  # insecure request: redirects come back as absolute http:// URLs, the session and CSRF cookies are
  # written without Secure, and the HSTS writer stays silent. Honour X-Forwarded-Proto instead.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        name: SCIM_VALIDATOR_UI_SESSION

management:
  server:
    port: 9090
  endpoint:
    health:
      show-components: always
  endpoints:
    web:
      exposure:
        include: health,prometheus
  health:
    ping:
      enabled: false
    ssl:
      enabled: false
    diskspace:
      enabled: false

logging:
  level:
    "[de.palsoftware.scim]": DEBUG
    "[org.springframework.security]": WARN

app:
  security:
    actuator:
      api-key: ${ACTUATOR_API_KEY}
    oidc:
      role-claim: https://scimplayground.dev/roles
      admin-role: admin
      user-role: user

  runs:
    max-per-user: ${APP_RUNS_MAX_PER_USER:10}
    max-published-per-user: ${APP_RUNS_MAX_PUBLISHED_PER_USER:50}

  compliance:
    public-base-url: ${APP_COMPLIANCE_PUBLIC_BASE_URL:https://scimsandbox.net}
    min-publish-score: ${APP_COMPLIANCE_MIN_PUBLISH_SCORE:50}
    min-core-coverage-percent: ${APP_COMPLIANCE_MIN_CORE_COVERAGE_PERCENT:50}
    reservation-timeout-seconds: ${APP_COMPLIANCE_RESERVATION_TIMEOUT_SECONDS:300}
    reservation-cleanup-interval-ms: ${APP_COMPLIANCE_RESERVATION_CLEANUP_INTERVAL_MS:60000}
    sample-run-ids: ${APP_COMPLIANCE_SAMPLE_RUN_IDS:11111111-1111-1111-1111-111111111111,22222222-2222-2222-2222-222222222222}

  github:
    publish-enabled: ${APP_GITHUB_PUBLISH_ENABLED:false}
    repo: ${APP_GITHUB_REPO:scimsandbox/scim-website}
    branch: ${APP_GITHUB_BRANCH:main}
    api-url: ${APP_GITHUB_API_URL:https://api.github.com}
    app-id: ${APP_GITHUB_APP_ID:}
    installation-id: ${APP_GITHUB_INSTALLATION_ID:}
    private-key: ${APP_GITHUB_PRIVATE_KEY:}

  server-manager:
    url: http://localhost:8080

