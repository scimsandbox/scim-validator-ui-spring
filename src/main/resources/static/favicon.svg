<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title>SCIM Compliance</title>
  <defs>
    <linearGradient id="compliance-bg" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#compliance-bg)"/>
  <!-- lucide `list-checks`: two ticks against three rules. Stroke weight is raised from the
       2.2 used in the nav to 5.5 in this 64-unit space, so the marks carry the same optical
       weight as a solid shape once the badge is scaled down to a 16px tab icon. -->
  <g fill="none" stroke="#f8fafc" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 20.5 15.5 25 24 16.5"/>
    <path d="M11 46.5 15.5 51 24 42.5"/>
  </g>
  <g fill="#5eead4">
    <rect x="31" y="17.5" width="23" height="5.5" rx="2.75"/>
    <rect x="31" y="30.5" width="23" height="5.5" rx="2.75"/>
    <rect x="31" y="43.5" width="23" height="5.5" rx="2.75"/>
  </g>
</svg>
