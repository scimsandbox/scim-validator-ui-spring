<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title>SCIM Playground</title>
  <defs>
    <linearGradient id="playground-bg" x1="10" y1="8" x2="54" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#playground-bg)"/>
  <!-- lucide `compass`, inverted into a solid disc with the needle cut out of it. Drawn as a
       stroked ring it goes muddy at 16px, because its two siblings carry large solid light
       masses and a thin ring cannot match that weight. The needle is filled with the badge's
       own gradient (userSpaceOnUse, so it lines up exactly) rather than punched with a mask —
       same result, and it does not depend on mask support in favicon renderers. -->
  <circle cx="32" cy="32" r="21" fill="#f8fafc"/>
  <g transform="translate(32 32) scale(2.3) translate(-12 -12)">
    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88" fill="url(#playground-bg)"/>
  </g>
</svg>
