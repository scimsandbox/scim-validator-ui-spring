<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title th:text="'SCIM Validation | ' + ${errorTitle}">SCIM Validation | Sign-in failed</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <link rel="stylesheet" th:href="@{/css/error.css}" href="/css/error.css">
</head>
<body>
    <main class="card">
        <h1 th:text="${errorTitle}">Sign-in failed</h1>
        <p th:text="${errorMessage}">Authentication could not be completed. Please try signing in again.</p>
        <a class="btn" th:href="${forceReauthentication} ? @{${retryLoginPath}(prompt='login')} : @{${retryLoginPath}}" href="/">Try signing in again</a>
    </main>
</body>
</html>
