<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${errorTitle} + ' — SCIM Compliance'">Sign-in failed — SCIM Compliance</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}" href="/favicon.svg">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1120;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 1.5rem;
        }
        .card {
            max-width: 28rem;
            width: 100%;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }
        h1 {
            margin: 0 0 0.75rem 0;
            font-size: 1.35rem;
            color: #f8fafc;
        }
        p {
            margin: 0 0 1.5rem 0;
            line-height: 1.55;
            color: #94a3b8;
        }
        a.btn {
            display: inline-block;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            padding: 0.65rem 1.15rem;
            border-radius: 8px;
        }
        a.btn:hover {
            background: #1d4ed8;
        }
    </style>
</head>
<body>
    <main class="card">
        <h1 th:text="${errorTitle}">Sign-in failed</h1>
        <p th:text="${errorMessage}">Authentication could not be completed. Please try signing in again.</p>
        <a class="btn" th:href="@{/}" href="/">Try signing in again</a>
    </main>
</body>
</html>
